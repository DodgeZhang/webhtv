name = "webhtv-playback-sync"
main = "src/index.js"
compatibility_date = "2024-12-01"

# KV 存储绑定 - 在 Cloudflare Dashboard 创建 KV 命名空间后，将 ID 填入下方
# 创建方式：Dashboard → Workers & Pages → KV → Create a namespace
kv_namespaces = [
  { binding = "PLAYBACK_KV", id = "377e2a698249404aa3bb903ddadba3d8" }
]

[vars]
# ⚠️ 安全提示：ACCESS_TOKEN 不要在此处填写真实值！
# 请在 Cloudflare Dashboard → Worker → Settings → Variables and secrets 中加密配置
# 留空表示不启用 Token 鉴权（不推荐生产环境）
ACCESS_TOKEN = ""

# 远端同步单次查询最大返回条数（1-2000）
MAX_ITEMS = "1000"

# 数据保留天数 - 超过此时间的记录在查询时自动过滤
RETENTION_DAYS = "90"

# 最大存储记录数 - 超出时自动丢弃最旧记录（建议 500-5000）
MAX_RECORDS = "500"