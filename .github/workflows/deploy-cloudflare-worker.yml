name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
      - master
    paths:
      - "serverless/webhtv-playback-sync-cloudflare/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:
    inputs:
      cf_env:
        description: "Cloudflare environment"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: false

env:
  WORKER_DIR: serverless/webhtv-playback-sync-cloudflare
  WORKER_NAME: webhtv-playback-sync
  KV_BINDING: PLAYBACK_KV

jobs:
  deploy:
    name: Deploy Worker to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ env.WORKER_DIR }}/package.json"

      - name: Install dependencies
        working-directory: "${{ env.WORKER_DIR }}"
        run: npm install

      - name: Install Wrangler CLI
        working-directory: "${{ env.WORKER_DIR }}"
        run: npm install wrangler@latest

      - name: Configure wrangler.toml
        id: config
        working-directory: "${{ env.WORKER_DIR }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TOKEN: ${{ secrets.WORKER_ACCESS_TOKEN }}
          KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          set -e

          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not configured."
            echo "Please add it in: GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not configured."
            exit 1
          fi

          if [ -z "${ACCESS_TOKEN}" ]; then
            echo "::warning::WORKER_ACCESS_TOKEN secret is not set. Worker will be deployed without authentication."
            echo "Anyone with the URL can read/write playback records."
          fi

          NAMESPACE_ID="${KV_NAMESPACE_ID}"

          if [ -z "${NAMESPACE_ID}" ]; then
            echo "KV namespace ID not provided, checking for existing..."
            LIST_OUTPUT=$(npx wrangler kv namespace list \
              --remote \
              --account-id="${CLOUDFLARE_ACCOUNT_ID}" \
              --api-token="${CLOUDFLARE_API_TOKEN}" --json 2>/dev/null || echo "[]")
            NAMESPACE_ID=$(echo "${LIST_OUTPUT}" | jq -r --arg title "${KV_BINDING}" '.[] | select(.title == $title) | .id' 2>/dev/null | head -1)
            if [ -n "${NAMESPACE_ID}" ]; then
              echo "Found existing KV namespace: ${NAMESPACE_ID}"
            else
              echo "Creating new KV namespace..."
              CREATE_OUTPUT=$(npx wrangler kv namespace create "${KV_BINDING}" \
                --remote \
                --account-id="${CLOUDFLARE_ACCOUNT_ID}" \
                --api-token="${CLOUDFLARE_API_TOKEN}" 2>&1)
              NAMESPACE_ID=$(echo "${CREATE_OUTPUT}" | sed -n 's/.*Namespace ID: \([a-f0-9]\{32\}\).*/\1/p')
              if [ -z "${NAMESPACE_ID}" ]; then
                echo "::error::Failed to create KV namespace."
                echo "Output: ${CREATE_OUTPUT}"
                exit 1
              fi
              echo "Created KV namespace: ${NAMESPACE_ID}"
              echo "::notice::Save this namespace ID as CLOUDFLARE_KV_NAMESPACE_ID in GitHub Secrets to reuse it."
            fi
          else
            echo "Using existing KV namespace: ${NAMESPACE_ID}"
          fi

          ACCESS_TOKEN_LINE=""
          if [ -n "${ACCESS_TOKEN}" ]; then
            ACCESS_TOKEN_LINE="ACCESS_TOKEN = \"${ACCESS_TOKEN}\""
          fi

          cat > wrangler.toml << WRANGLER_EOF
name = "${WORKER_NAME}"
main = "src/index.js"
compatibility_date = "2024-12-01"

kv_namespaces = [
  { binding = "${KV_BINDING}", id = "${NAMESPACE_ID}" }
]

[vars]
${ACCESS_TOKEN_LINE}
MAX_ITEMS = "1000"
RETENTION_DAYS = "90"
MAX_RECORDS = "500"
WRANGLER_EOF

          echo "wrangler.toml configured:"
          cat wrangler.toml
          echo "namespace_id=${NAMESPACE_ID}" >> "$GITHUB_OUTPUT"

      - name: Validate Worker
        working-directory: "${{ env.WORKER_DIR }}"
        run: |
          npx wrangler deploy --dry-run 2>/dev/null || {
            echo "::warning::wrangler dry-run failed (this is normal, continuing with deployment)"
          }
          node --check src/index.js

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.WORKER_DIR }}
          persist: true

      - name: Verify deployment
        run: |
          sleep 5
          WORKER_URL="https://${{ env.WORKER_NAME }}.${{ secrets.CLOUDFLARE_SUBDOMAIN }}.workers.dev"
          echo "Checking health endpoint: ${WORKER_URL}/api/health"
          RESPONSE=$(curl -s --max-time 10 "${WORKER_URL}/api/health")
          if echo "${RESPONSE}" | grep -q '"ok":true'; then
            echo "✅ Worker health check passed"
            echo "Response: ${RESPONSE}"
          else
            echo "::warning::Worker health check failed or timed out"
            echo "Response: ${RESPONSE}"
          fi

      - name: Print deployment info
        run: |
          WORKER_URL="https://${{ env.WORKER_NAME }}.${{ secrets.CLOUDFLARE_SUBDOMAIN }}.workers.dev"
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║           🎉 Deployment Successful!                     ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  Worker URL:  ${WORKER_URL}"
          echo "║  Health:      ${WORKER_URL}/api/health"
          echo "║  Records API:  ${WORKER_URL}/api/playback/records"
          echo "║  Webhook:     POST ${WORKER_URL}/api/playback/webhook"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "Next steps:"
          echo "  1. In WebHTV App → Settings → Playback Sync, add this Worker as a sync target"
          echo "  2. Use the same ACCESS_TOKEN you configured in WORKER_ACCESS_TOKEN secret"
          echo "  3. (Optional) Bind a custom domain in Cloudflare Dashboard"