name: Sync Fork Branches

# 把上游 Silent1566/webhtv 的 main / beta 同步到本仓库同名分支。
#
# 默认用"合并"语义（与 GitHub 自带的 Sync fork 一致）：把上游提交合并进本仓库同名分支，
# 本地提交（比如本工作流自身、以及后续加在 main 上的本地文件）都会被保留。上游重写历史
# 或与本地改动冲突时会中止，把问题留在日志里由人工处理，绝不静默丢弃。
# 需要把目标分支变成上游的纯镜像（丢弃本地提交）时，手动 workflow_dispatch 勾选 force。
#
# 注意：跨仓库没有 push webhook 可用，这里靠定时轮询，所以上游更新后最多有一个轮询间隔的延迟。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "目标分支存在上游之外的提交时仍覆盖（会丢弃这些提交）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sync-fork-branches
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Silent1566/webhtv

jobs:
  sync:
    name: Sync ${{ matrix.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        branch: [main, beta]

    steps:
      # persist-credentials 关掉，推送凭据完全由下一步显式指定，避免 checkout 留下的
      # extraheader 把 PAT 覆盖回 GITHUB_TOKEN。
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      # 默认用 GITHUB_TOKEN，但它触发的 push 不会再触发其它 workflow。
      # 如果同步后需要让本仓库的 android-release / delayed-dev-promotion 等流程也跟着跑，
      # 就配置一个带 repo 权限的 PAT 到 secrets.SYNC_FORK_TOKEN。
      - name: Configure push credentials
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_FORK_TOKEN }}
          DEFAULT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token="${SYNC_TOKEN:-${DEFAULT_TOKEN}}"
          git remote set-url origin "https://x-access-token:${token}@github.com/${GITHUB_REPOSITORY}.git"
          # 合并提交需要身份，checkout 不会自动配置。
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream branch
        env:
          BRANCH: ${{ matrix.branch }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git" 2>/dev/null || true
          git fetch --no-tags --prune upstream "+refs/heads/${BRANCH}:refs/remotes/upstream/${BRANCH}"

          local_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse "upstream/${BRANCH}")"

          if [ "$local_sha" = "$upstream_sha" ]; then
            echo "${BRANCH} 已与上游一致（${local_sha:0:12}），无需同步。"
            exit 0
          fi
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "${BRANCH} 已包含上游全部提交，无需同步。"
            exit 0
          fi

          if [ "$FORCE" = "true" ]; then
            echo "force=true：把 ${BRANCH} 覆盖为上游 ${upstream_sha:0:12}，丢弃 ${local_sha:0:12} 上的本地提交。"
            git reset --hard "$upstream_sha"
            git push origin "HEAD:refs/heads/${BRANCH}" \
              --force-with-lease="refs/heads/${BRANCH}:${local_sha}"
          else
            if git merge-base --is-ancestor "$local_sha" "$upstream_sha"; then
              echo "${BRANCH} 快进到 ${upstream_sha:0:12}。"
              git merge --ff-only "$upstream_sha"
            else
              echo "${BRANCH} 本地有提交，与上游 ${upstream_sha:0:12} 合并（保留本地提交）。"
              if ! git merge --no-edit "$upstream_sha"; then
                git merge --abort || true
                echo "::error title=上游合并冲突::${BRANCH} 合并上游 ${upstream_sha:0:12} 时冲突，需要人工处理。"
                exit 1
              fi
            fi
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi

          {
            echo "## 分支同步：${BRANCH}"
            echo
            echo "- 上游仓库：\`${UPSTREAM_REPOSITORY}\`"
            echo "- 同步前：\`${local_sha:0:12}\`"
            echo "- 同步后：\`${upstream_sha:0:12}\`"
          } >> "$GITHUB_STEP_SUMMARY"